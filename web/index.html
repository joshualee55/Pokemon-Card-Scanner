<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141f"><link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><title>Card Tracker</title>
<style>
:root{--bg:#10141f;--card:#1b2131;--line:#2a3247;--tx:#eef1f8;--mut:#8b94ab;--ac:#ffcb05;--bl:#4d63ff;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:80px}
header{padding:16px;font-weight:700;font-size:20px;padding-top:max(16px,env(safe-area-inset-top))}
main{padding:0 16px;max-width:560px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 0;font-size:14px}nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:12px;align-items:center}.row img{width:56px;border-radius:4px}.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}.price{font-weight:700;color:var(--ok)}
button.p{background:var(--ac);color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px}
button.s{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:8px 12px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;width:100%}
select{width:auto}.cam{position:relative;background:#000;border-radius:12px;overflow:hidden}
video{width:100%;display:block}.guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px dashed var(--ac);border-radius:10px;pointer-events:none;box-sizing:border-box}
.tabs{display:none}.tabs.on{display:block}h2{font-size:18px;margin:16px 0 4px}
.big{font-size:28px;font-weight:800}.win{color:var(--ok)}.lose{color:var(--bad)}
.sl{margin:10px 0}.sl input[type=range]{width:100%;padding:0;accent-color:var(--ac)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.ticks span.sug{color:var(--ac);font-weight:700}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
.panel .row{margin-top:8px}.qty{width:70px}.cl{font-weight:700}.sm{padding:4px 8px;font-size:13px}
.noauth main,.noauth nav{display:none}#auth{display:none;max-width:420px;margin:8vh auto;padding:0 16px}.noauth #auth{display:block}
header{display:flex;align-items:center;justify-content:space-between}#who{font-size:13px;font-weight:400;color:var(--mut)}#who button{margin-left:8px}
#auth input{margin:6px 0}.err{color:var(--bad);min-height:20px;font-size:14px}.link{background:none;border:0;color:var(--ac);padding:8px 0;font-size:14px}
:root{--series-1:#3987e5}
.chips{display:flex;gap:6px}.chips button{background:var(--line);color:var(--mut);border:0;border-radius:8px;padding:6px 10px;font-size:13px}.chips button.on{background:var(--bl);color:#fff}
.chart{position:relative;margin-top:8px}.chart svg{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .axt{fill:var(--mut);font-size:11px}.chart .ln{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .xh{stroke:var(--mut);stroke-width:1}.chart .dot{fill:var(--series-1);stroke:var(--card);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.tip b{display:block}.empty{padding:28px 8px;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}table.t td:last-child,table.t th:last-child{text-align:right}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;overflow:auto}#sheet.on{display:block}
.sbox{background:var(--card);border-radius:16px;max-width:560px;margin:5vh auto;padding:16px;width:calc(100% - 24px)}
.sbox img.big{width:110px;border-radius:6px}
</style></head><body class="noauth">
<header><span>🃏 Card Tracker</span><span id="who"></span></header>
<div id="auth"><div class="card"><h2 id="atitle" style="margin-top:0">Sign in</h2>
 <input id="au" placeholder="Username" autocomplete="username" autocapitalize="none">
 <input id="ap" type="password" placeholder="Password" autocomplete="current-password">
 <input id="ai" placeholder="Invite code (from the app owner)" style="display:none" autocapitalize="none">
 <div class="err" id="aerr"></div>
 <button class="p" id="ago" style="width:100%">Sign in</button>
 <button class="link" id="aswitch">New here? Create an account</button>
 <div class="mut" id="ahint" style="display:none">Password: at least 8 characters. Forgot it later? Ask the app owner to reset it.</div></div></div>
<main>

<section id="scan" class="tabs on">
  <div class="cam"><video id="vid" playsinline muted autoplay></video><div class="guide"></div></div>
  <p class="mut">Fill the dashed frame with the card, flat and well lit.</p>
  <div class="row"><button class="p grow" id="snap">📷 Scan card</button>
  <button class="s" id="pick">Upload</button></div>
  <input type="file" id="file" accept="image/*" hidden>
  <div id="scanout"></div>
</section>

<section id="coll" class="tabs"><div class="card"><div class="mut">Collection value</div><div class="big" id="total">$0.00</div></div>
  <div class="card"><div class="row"><b class="grow">Value over time</b><div class="chips" id="cchips"></div></div><div id="cchart"></div>
  <div class="mut" id="cnote"></div></div><div id="items"></div></section>

<section id="trade" class="tabs">
  <div id="tradeside"></div>
  <div class="card"><div class="mut" id="verdictlbl">Add cards to both sides</div><div class="big" id="verdict">—</div><div class="mut" id="tdetail"></div></div>
</section>

<section id="srch" class="tabs"><input id="q" placeholder="Search card name…" autocomplete="off"><div id="results"></div></section>
</main>
<div id="sheet"><div class="sbox" id="sbox"></div></div>
<nav><button data-t="scan" class="on">Scan</button><button data-t="coll">Collection</button><button data-t="trade">Trade</button><button data-t="srch">Search</button></nav>

<script>
const $=s=>document.querySelector(s), money=v=>v==null?"n/a":"$"+v.toFixed(2);
let CONDS=[],MULT={};
const lbl=c=>MULT[c]?`${MULT[c].label} · ${Math.round(MULT[c].multiplier*100)}% of market`:c;
// reusable slider: user has final say, suggestion shown as highlighted tick
function slider(id,val,sug){return `<div class="sl"><input type="range" id="${id}" min="0" max="${CONDS.length-1}" step="1" value="${Math.max(0,CONDS.indexOf(val))}">
 <div class="ticks">${CONDS.map(c=>`<span class="${c===sug?"sug":""}">${c}${c===sug?" ★":""}</span>`).join("")}</div>
 <div class="mut"><span class="cl" id="${id}-l">${lbl(val)}</span>${sug?` · suggested: ${sug}`:""}</div></div>`}
const sliderVal=id=>CONDS[+$("#"+id).value];
function bindSlider(id,fn){const el=$("#"+id);el.oninput=()=>{$("#"+id+"-l").textContent=lbl(sliderVal(id));fn&&fn(sliderVal(id))}}
const api=(p,o)=>fetch("/api"+p,o).then(async r=>{if(!r.ok){let m=r.status;try{const j=await r.json();m=typeof j.detail==="string"?j.detail:(j.detail&&j.detail[0]&&j.detail[0].msg)||m}catch(e){}
  if(r.status===401&&p!=="/login"&&ME){ME=null;showAuth()}throw new Error(m)}return r.json()});
const post=(p,b)=>api(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
const metaP=api("/meta").then(m=>{CONDS=m.conditions.map(c=>c.code);m.conditions.forEach(c=>MULT[c.code]=c)});
let tradeSel={give:[],get:[]}, addTarget="coll";

// tabs
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".tabs").forEach(t=>t.classList.toggle("on",t.id===b.dataset.t));
  if(b.dataset.t==="coll")loadColl(); if(b.dataset.t==="trade")renderTrade();
  if(b.dataset.t==="scan")startCam(); else stopCam();
});
const cardRow=(c,extra="")=>`<div class="card row"><img src="${c.image}" loading="lazy" data-open="${c.id}" data-variant="${c.variant||""}" style="cursor:pointer"><div class="grow" data-open="${c.id}" data-variant="${c.variant||""}" style="cursor:pointer"><b>${c.name}</b><div class="mut">${c.set} · #${c.number} · ${c.rarity||""}${c.variant_label&&(c.variants||[]).length>1?` · <b style="color:var(--tx)">${c.variant_label}</b>`:""}</div><div class="price">${money(c.adjusted_value??c.market)}</div></div>${extra}</div>`;

// camera
let stream;
async function startCam(){ if(stream)return;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920}}});$("#vid").srcObject=stream}
  catch(e){$("#scanout").innerHTML=`<div class="card mut">Camera unavailable (needs HTTPS or localhost). Use Upload instead.</div>`}}
function stopCam(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
// guide box: always a real card shape (63:88), sized to fit the camera view
function guideSize(){const v=$("#vid"),dw=v.clientWidth,dh=v.clientHeight;
  const gw=Math.min(dw*.8,dh*.88*63/88);return {dw,dh,gw,gh:gw*88/63}}
function updateGuide(){const {gw,gh}=guideSize();if(!gw)return;const g=document.querySelector(".guide");g.style.width=gw+"px";g.style.height=gh+"px"}
$("#vid").addEventListener("loadedmetadata",updateGuide);window.addEventListener("resize",updateGuide);
function cropFrame(){ // crop exactly what is inside the dashed guide
  const v=$("#vid"),W=v.videoWidth,H=v.videoHeight,{dw,gw,gh}=guideSize(),k=W/dw;
  const w=gw*k,h=gh*k,x=(W-w)/2,y=(H-h)/2;
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(v,x,y,w,h,0,0,w,h);return c}
$("#snap").onclick=()=>{ if(!stream)return $("#file").click(); cropFrame().toBlob(sendScan,"image/jpeg",.9)};
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{if(e.target.files[0])sendScan(e.target.files[0]);e.target.value=""};
async function sendScan(blob){
  $("#scanout").innerHTML=`<div class="card mut">Identifying…</div>`;
  const fd=new FormData();fd.append("file",blob,"scan.jpg");
  try{const r=await api("/scan",{method:"POST",body:fd});
    $("#scanout").innerHTML=`<h2>Best matches</h2><div class="mut">Suggested condition: <b>${r.condition.condition}</b> — rough guess; you set the final condition when adding</div>`+
    r.matches.slice(0,4).map((m,i)=>`<div id="m${i}">`+cardRow(m,`<div><div class="mut">${Math.round(m.confidence*100)}%</div><button class="s" data-i="${i}">+ Add</button></div>`)+`<div id="p${i}"></div></div>`).join("");
    $("#scanout").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>openAdd(r.matches[b.dataset.i],b.dataset.i,r.condition.condition));
  }catch(e){$("#scanout").innerHTML=`<div class="card">Scan failed (${e.message}). Has the catalogue been ingested?</div>`}}

const vsel=(id,m,cur)=>(m.variants||[]).length>1?`<div class="sl"><label class="mut">Variant</label><select id="${id}" style="width:100%">${m.variants.map(v=>`<option value="${v.code}" ${v.code===cur?"selected":""}>${v.label} — ${money(v.market)}</option>`).join("")}</select></div>`:"";
const vprice=(m,v)=>{const x=(m.variants||[]).find(z=>z.code===v);return x?x.market:m.market};
function openAdd(m,i,sug){const box=$("#p"+i);if(box.innerHTML){box.innerHTML="";return}
  box.innerHTML=`<div class="panel">${vsel("vs"+i,m,m.variant)}<b>Card condition</b>${slider("cs"+i,"NM",sug)}
   <div class="row"><span class="mut">Value</span><b class="price" id="pv${i}">${money(m.market)}</b><span class="grow"></span>
   Qty <input class="qty" id="q${i}" type="number" min="1" value="1"><button class="p" id="sv${i}">Save</button></div></div>`;
  const cv=()=>$("#vs"+i)?$("#vs"+i).value:m.variant;
  const upd=()=>{const pr=vprice(m,cv());$("#pv"+i).textContent=money(pr==null?null:pr*MULT[sliderVal("cs"+i)].multiplier)};
  bindSlider("cs"+i,upd);if($("#vs"+i))$("#vs"+i).onchange=upd;
  $("#sv"+i).onclick=async()=>{await post("/collection",{card_id:m.id,condition:sliderVal("cs"+i),qty:+$("#q"+i).value||1,variant:cv()||null});box.innerHTML=`<div class="mut" style="padding:6px">✓ Added to collection</div>`}}

// collection
async function loadColl(){const r=await api("/collection");$("#total").textContent=money(r.total_value);
  Promise.all([api("/collection/history"),api("/prices/status")]).then(([h,st])=>{
    rangeChart($("#cchips"),$("#cchart"),h.points.map(p=>({day:p.day,v:p.value})));
    const when=st.last_refresh?new Date(st.last_refresh*1000).toLocaleString():"not yet";
    $("#cnote").innerHTML=(h.total?`Shows the value of the ${h.total} card type${h.total>1?"s":""} you own now${h.counted<h.total?` (${h.counted} with price history so far)`:""}, at your chosen conditions. `:"Add cards to see their value over time. ")+
      `Prices checked: ${when} <button class="link" id="rp">Refresh prices</button>`;
    const b=$("#rp");if(b)b.onclick=async()=>{b.textContent="Refreshing…";try{await post("/prices/refresh",{});setTimeout(loadColl,8000)}catch(e){b.textContent=e.message}}}).catch(()=>{});
  $("#items").innerHTML=r.items.map((i,n)=>`<div>`+cardRow(i,`<div class="mut" style="text-align:right">${i.condition} ×${i.qty}<br><button class="s sm" data-e="${n}">Edit</button></div>`)+`<div id="ep${n}"></div></div>`).join("")||`<p class="mut">No cards yet — scan one.</p>`;
  $("#items").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const it=r.items[b.dataset.e],n=b.dataset.e,box=$("#ep"+n);if(box.innerHTML){box.innerHTML="";return}
    box.innerHTML=`<div class="panel">${vsel("ev"+n,it,it.variant)}${slider("ce"+n,it.condition)}<div class="row">Qty <input class="qty" id="eq${n}" type="number" min="1" value="${it.qty}"><span class="grow"></span>
      <button class="s" id="rm${n}">Remove</button><button class="p" id="es${n}">Save</button></div></div>`;bindSlider("ce"+n);
    $("#es"+n).onclick=async()=>{await api("/collection/"+it.entry_id,{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({condition:sliderVal("ce"+n),qty:+$("#eq"+n).value||1,variant:$("#ev"+n)?$("#ev"+n).value:null})});loadColl()};
    $("#rm"+n).onclick=async()=>{if(confirm("Remove from collection?")){await api("/collection/"+it.entry_id,{method:"DELETE"});loadColl()}}})}

// search (also used to add to collection or trade)
let t;$("#q").oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const q=$("#q").value.trim();if(q.length<2)return;
  const r=await api("/search?q="+encodeURIComponent(q));
  $("#results").innerHTML=r.map((c,i)=>cardRow(c,`<div><button class="s" data-a="coll" data-i="${i}">+Coll</button><br><br><button class="s" data-a="give" data-i="${i}">Give</button> <button class="s" data-a="get" data-i="${i}">Get</button></div>`)).join("");
  $("#results").querySelectorAll("button").forEach(b=>b.onclick=async()=>{const c=r[b.dataset.i],a=b.dataset.a;
    if(a==="coll")await post("/collection",{card_id:c.id});else tradeSel[a].push({card_id:c.id,condition:"NM",qty:1,name:c.name,variant:c.variant,variants:c.variants});
    b.textContent="✓"})},300)};

// trade
function renderTrade(){
  const side=(k,l)=>`<h2>${l}</h2>`+(tradeSel[k].map((x,i)=>`<div class="card"><div class="row"><div class="grow"><b>${x.name}</b></div>
    <button class="s sm" data-rm="${k}" data-i="${i}">✕</button></div>${vsel(`tv${k}${i}`,x,x.variant)}${slider(`t${k}${i}`,x.condition)}</div>`).join("")||`<div class="mut">Use Search → Give / Get</div>`);
  $("#tradeside").innerHTML=side("give","You give")+side("get","You get");
  ["give","get"].forEach(k=>tradeSel[k].forEach((x,i)=>{bindSlider(`t${k}${i}`,c=>{x.condition=c;calcTrade()});const v=$(`#tv${k}${i}`);if(v)v.onchange=()=>{x.variant=v.value;calcTrade()}}));
  $("#tradeside").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{tradeSel[b.dataset.rm].splice(b.dataset.i,1);renderTrade()});
  calcTrade()}
async function calcTrade(){const {give,get}=tradeSel;if(!give.length||!get.length){$("#verdict").textContent="—";return}
  const r=await post("/trade",{give,get});
  $("#verdictlbl").textContent="Verdict";$("#verdict").textContent=r.verdict.toUpperCase();
  $("#verdict").className="big "+(r.verdict==="you win"?"win":r.verdict==="you lose"?"lose":"");
  $("#tdetail").textContent=`Give ${money(r.give_total)} · Get ${money(r.get_total)} · Diff ${money(Math.abs(r.difference))}`}

// ---- price charts (plain SVG) ----
const dfmt=(d,y)=>new Date(d+"T00:00:00").toLocaleDateString(undefined,y?{month:"short",day:"numeric",year:"numeric"}:{month:"short",day:"numeric"});
const RANGES=[[7,"7D"],[30,"30D"],[90,"90D"],[365,"1Y"],[0,"All"]];
function inRange(pts,days){if(!days||!pts.length)return pts;const last=new Date(pts[pts.length-1].day+"T00:00:00");
  return pts.filter(p=>(last-new Date(p.day+"T00:00:00"))/864e5<=days)}   // window ends at the newest data point
function chipsHTML(id,cur){return RANGES.map(([d,l])=>`<button data-r="${d}" class="${d===cur?"on":""}">${l}</button>`).join("")}
function lineChart(el,pts,{fmt=money}={}){
  if(!pts.length){el.innerHTML=`<div class="empty mut">No price history yet.</div>`;return}
  const W=340,H=190,L=48,R=12,T=10,B=26,n=pts.length,vals=pts.map(p=>p.v);let lo=Math.min(...vals),hi=Math.max(...vals);
  if(lo===hi){const pad=Math.max(lo*.05,.5);lo-=pad;hi+=pad}else{const pad=(hi-lo)*.12;lo-=pad;hi+=pad}
  const t0=new Date(pts[0].day+"T00:00:00").getTime(),t1=new Date(pts[n-1].day+"T00:00:00").getTime();
  const X=p=>L+(n===1||t1===t0?(W-L-R)/2:(new Date(p.day+"T00:00:00").getTime()-t0)/(t1-t0)*(W-L-R)),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
  const grid=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axt" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v<100?"$"+v.toFixed(2):"$"+Math.round(v)}</text>`).join("");
  const xl=n===1?`<text class="axt" x="${X(pts[0])}" y="${H-6}" text-anchor="middle">${dfmt(pts[0].day,1)}</text>`:
    `<text class="axt" x="${L}" y="${H-6}" text-anchor="start">${dfmt(pts[0].day,t1-t0>3e10)}</text><text class="axt" x="${W-R}" y="${H-6}" text-anchor="end">${dfmt(pts[n-1].day,t1-t0>3e10)}</text>`;
  const path=n>1?`<polyline class="ln" points="${pts.map(p=>X(p)+","+Y(p.v)).join(" ")}"/>`:"";
  const endDot=`<circle class="dot" cx="${X(pts[n-1])}" cy="${Y(pts[n-1].v)}" r="5"/>`;
  el.innerHTML=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price over time, ${n} points, from ${fmt(vals[0])} to ${fmt(vals[n-1])}">${grid}${xl}${path}${endDot}
    <line class="xh" id="xh" y1="${T}" y2="${H-B}" style="display:none"/><circle class="dot" id="hd" r="5" style="display:none"/><rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>
    <div class="tip" id="tip"></div></div>
    ${n===1?`<div class="mut" style="margin-top:6px">Only one price point so far. The line appears as the price source publishes new prices.</div>`:""}
    <div style="margin-top:6px"><button class="link" id="tbl">Show as table</button></div><div id="tblbox"></div>`;
  const svg=el.querySelector("svg"),tip=el.querySelector("#tip"),xh=el.querySelector("#xh"),hd=el.querySelector("#hd");
  function show(ev){const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W;let best=pts[0],bd=1e9;
    pts.forEach(p=>{const d=Math.abs(X(p)-x);if(d<bd){bd=d;best=p}});
    xh.setAttribute("x1",X(best));xh.setAttribute("x2",X(best));xh.style.display="";hd.setAttribute("cx",X(best));hd.setAttribute("cy",Y(best.v));hd.style.display="";
    tip.innerHTML=`<b>${fmt(best.v)}</b>${dfmt(best.day,1)}`;tip.style.display="block";
    const px=X(best)/W*r.width;tip.style.left=Math.max(50,Math.min(r.width-50,px))+"px";tip.style.top=(Y(best.v)/H*r.height)+"px"}
  const hide=()=>{tip.style.display=xh.style.display=hd.style.display="none"},hit=el.querySelector("#hit");
  hit.addEventListener("pointermove",show);hit.addEventListener("pointerdown",show);hit.addEventListener("pointerleave",hide);
  el.querySelector("#tbl").onclick=e=>{const box=el.querySelector("#tblbox");if(box.innerHTML){box.innerHTML="";e.target.textContent="Show as table";return}
    box.innerHTML=`<table class="t"><tr><th>Date</th><th>Value</th></tr>${[...pts].reverse().map(p=>`<tr><td>${dfmt(p.day,1)}</td><td>${fmt(p.v)}</td></tr>`).join("")}</table>`;e.target.textContent="Hide table"}
}
function rangeChart(chipsEl,chartEl,allPts,def=0){let cur=def;const draw=()=>{chipsEl.innerHTML=chipsHTML("",cur);
    chipsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.r;draw()});lineChart(chartEl,inRange(allPts,cur))};draw()}
async function openCard(id,variant){const sh=$("#sheet"),box=$("#sbox");sh.classList.add("on");box.innerHTML=`<div class="mut">Loading…</div>`;
  try{const r=await api("/card/"+encodeURIComponent(id)+(variant?"?variant="+encodeURIComponent(variant):"")),c=r.card,pts=r.points.map(p=>({day:p.day,v:p.market}));
    box.innerHTML=`<div class="row" style="align-items:flex-start"><img class="big" src="${c.image}"><div class="grow"><b style="font-size:18px">${c.name}</b>
      <div class="mut">${c.set} · #${c.number}${c.rarity?" · "+c.rarity:""}</div><div class="big price">${money(c.market)}</div>
      <div class="mut">${c.variant_label||""}${c.price_day?" · price from "+dfmt(c.price_day,1):""}</div></div><button class="s" id="sx">✕</button></div>
      ${(c.variants||[]).length>1?`<div class="chips" id="vchips" style="margin-top:12px;flex-wrap:wrap">${c.variants.map(v=>`<button data-v="${v.code}" class="${v.code===c.variant?"on":""}">${v.label} ${money(v.market)}</button>`).join("")}</div>`:""}
      <div class="row" style="margin-top:14px"><b class="grow">Price over time</b><div class="chips" id="schips"></div></div><div id="schart"></div>
      <div class="mut" style="margin-top:8px">Each variant has its own price and history. Points are added whenever the price source updates, so history builds up over time.</div>`;
    $("#sx").onclick=()=>sh.classList.remove("on");rangeChart($("#schips"),$("#schart"),pts);
    document.querySelectorAll("#vchips button").forEach(b=>b.onclick=()=>openCard(id,b.dataset.v))
  }catch(e){box.innerHTML=`<div class="card">Couldn't load that card (${e.message}). <button class="s" id="sx">Close</button></div>`;$("#sx").onclick=()=>sh.classList.remove("on")}}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("#sheet").classList.remove("on")});
document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o)openCard(o.dataset.open,o.dataset.variant||undefined)});

// ---- accounts ----
let ME=null,signup=false;
function showAuth(){stopCam();document.body.classList.add("noauth");$("#who").textContent=""}
function showApp(u){ME=u;document.body.classList.remove("noauth");$("#who").innerHTML=`${u.username}<button class="s sm" id="lo">Sign out</button>`;
  $("#lo").onclick=async()=>{await post("/logout",{}).catch(()=>{});location.reload()};
  tradeSel={give:[],get:[]};document.querySelector('nav [data-t=scan]').click()}
function setMode(su){signup=su;$("#atitle").textContent=su?"Create account":"Sign in";$("#ago").textContent=su?"Create account":"Sign in";
  $("#ai").style.display=$("#ahint").style.display=su?"":"none";$("#ap").autocomplete=su?"new-password":"current-password";
  $("#aswitch").textContent=su?"Already have an account? Sign in":"New here? Create an account";$("#aerr").textContent=""}
$("#aswitch").onclick=()=>setMode(!signup);
async function submitAuth(){const b={username:$("#au").value.trim(),password:$("#ap").value,invite:$("#ai").value};$("#aerr").textContent="";$("#ago").disabled=true;
  try{const r=await post(signup?"/signup":"/login",b);$("#ap").value="";showApp(r.user)}catch(e){$("#aerr").textContent=e.message}$("#ago").disabled=false}
$("#ago").onclick=submitAuth;[$("#au"),$("#ap"),$("#ai")].forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter")submitAuth()}));
async function boot(){const r=await api("/me").catch(()=>({user:null}));r.user?showApp(r.user):showAuth()}

if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
metaP.then(boot);
</script></body></html>
